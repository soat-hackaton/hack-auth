root = "."
tmp_dir = "tmp"

[build]
  # Comando para compilar
  cmd = "go build -o ./tmp/main cmd/api/main.go"
  # Onde o binário compilado fica
  bin = "./tmp/main"
  # Extensões para observar
  include_ext = ["go", "tpl", "tmpl", "html"]
  # Pastas para ignorar
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"