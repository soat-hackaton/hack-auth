name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: hack-auth
  EKS_CLUSTER_NAME: hack-infra-eks
  IMAGE_NAME_IN_DEPLOYMENT: hack-auth

jobs:
  # ------------------------------------------------------------------
  # JOB 1: TEST
  # ------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Run Tests
        run: go test -v ./...

  # ------------------------------------------------------------------
  # JOB 2: BUILD & PUSH
  # ------------------------------------------------------------------
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    # Exporta a URL da imagem para o próximo job usar
    outputs:
      docker_image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Cria a URL completa da imagem
          FULL_IMAGE_URL="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          
          # Build e Push
          docker build -t $FULL_IMAGE_URL .
          docker push $FULL_IMAGE_URL
          
          # Salva no output do GitHub Actions para o job de Deploy ler
          echo "image=$FULL_IMAGE_URL" >> $GITHUB_OUTPUT

  # ------------------------------------------------------------------
  # JOB 3: DEPLOY
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Kubernetes Manifests
        env:
          NEW_IMAGE: ${{ needs.build.outputs.docker_image }}
        run: |
          cd k8s/overlays/dev
          kustomize edit set image ${{ env.IMAGE_NAME_IN_DEPLOYMENT }}=$NEW_IMAGE
          cat kustomization.yaml # Debug para ver se trocou certo

      - name: Update Kube Config
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to Cluster
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl rollout restart deployment/auth-service -n hack-auth