name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: hack-auth
  EKS_CLUSTER_NAME: hack-infra-eks
  IMAGE_NAME_IN_DEPLOYMENT: hack-auth

jobs:
  # ------------------------------------------------------------------
  # JOB 1: TEST & COVERAGE
  # ------------------------------------------------------------------
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Atualizado v4

      - name: Setup Go
        uses: actions/setup-go@v5 # Atualizado v5 (corrige o erro do tar)
        with:
          go-version: '1.25' # Usando a versão que definimos no go.mod
          cache: true

      - name: Run Tests with Coverage
        id: test-coverage
        run: |
          echo "Running Tests..."
          go test -v -coverprofile=coverage.out ./internal/service/... ./internal/handler/...
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Current Coverage: $COVERAGE%"
          if awk "BEGIN {exit !($COVERAGE < 80.0)}"; then
            echo "FAILED: Code coverage is below 80% ($COVERAGE%)"
            exit 1
          else
            echo "PASSED: Code coverage is above 80%"
          fi

  # ------------------------------------------------------------------
  # JOB 2: BUILD & PUSH
  # ------------------------------------------------------------------
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    # MUDANÇA: Passamos apenas a TAG, não a URL inteira (evita bloqueio de secret)
    outputs:
      image_tag: ${{ steps.build-image.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4 # Atualizado v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2 # Atualizado v2 (corrige warnings)

      - name: Build, Tag, and Push Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          FULL_IMAGE_URL="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          
          echo "🔨 Building: $FULL_IMAGE_URL"
          docker build -t $FULL_IMAGE_URL .
          docker push $FULL_IMAGE_URL
          
          # Passamos apenas a TAG para o próximo job
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ------------------------------------------------------------------
  # JOB 3: DEPLOY
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Kubernetes Manifests
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          NEW_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          # Reconstrói a URL completa aqui dentro
          FULL_IMAGE_URL="$ECR_REGISTRY/$ECR_REPOSITORY:$NEW_TAG"
          
          echo "🚀 Deploying image: $FULL_IMAGE_URL"
          
          cd k8s/overlays/dev
          kustomize edit set image ${{ env.IMAGE_NAME_IN_DEPLOYMENT }}=$FULL_IMAGE_URL
          
          # Debug para garantir que trocou
          cat kustomization.yml

      - name: Update Kube Config
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Inject Secrets into Cluster
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "Updating Kubernetes Secrets..."
          
          # Remove a secret antiga
          kubectl delete secret auth-secrets -n hack-auth --ignore-not-found
          
          # Cria a nova secret com:
          # 1. Nome correto (auth-secrets)
          # 2. Chaves em minúsculo (para bater com o deployment)
          # 3. Adição do JWT
          kubectl create secret generic auth-secrets \
            --namespace hack-auth \
            --from-literal=aws_access_key_id=$AWS_KEY \
            --from-literal=aws_secret_access_key=$AWS_SECRET \
            --from-literal=aws_session_token=$AWS_TOKEN \
            --from-literal=jwt_secret=$JWT_SECRET

      - name: Deploy to Cluster
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl rollout restart deployment/auth-service -n hack-auth